<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://qianqiuzy-1313476938.cos.ap-shanghai.myqcloud.com/32x32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="https://qianqiuzy-1313476938.cos.ap-shanghai.myqcloud.com/16x16.png" sizes="16x16" type="image/png">    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/message.css') }}">
    <title>花礼的提问箱</title>
</head>
<body>
    <div id="overlay" class="overlay"></div>
    <div class="background-layer" style="background-image: url('https://qianqiuzy-1313476938.cos.ap-shanghai.myqcloud.com/harei-back.jpg');"></div>
    <div id="host-sidebar-container"></div>
    <div class="main-content">
        <div class="profile-section">
            <div class="container">

                <!-- 左侧会话列表 -->
                <div class="chat-list">
                    {% for chat in chat_data %}
                        <li><a href="#" class="chat-link" data-id="{{ chat.id }}">{{ chat.title }}</a></li>
                    {% endfor %}
                </div>
        
                <!-- 右侧会话内容 -->
                <div class="chat-content">
                    {% for chat in chat_data %}
                        <div id="chat-{{ chat.id }}" class="chat-box" style="display: none;">
                            <h2>{{ chat.title }}</h2>
                            <p>这是 {{ chat.title }} 的内容。</p>
                            
                            <!-- 遍历并显示所有与该消息关联的图片 -->
                            {% for image_url in chat.images %}
                                <img src="{{ image_url }}" alt="{{ chat.title }} Image" style="max-width: 100%; border-radius: 10px; margin-bottom: 10px;">
                            {% endfor %}
                        </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
    <script src="static/js/script.js"></script>
    <script src="static/js/messages.js"> </script>
</body>
</html>
