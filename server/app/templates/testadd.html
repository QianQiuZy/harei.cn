<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加新歌曲</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/style.css') }}"> <!-- 引入样式表 -->
</head>
<body>
    <div class="container">
        <h1>添加新歌曲</h1>
        <!-- 歌曲信息表单 -->
        <form id="add-song-form">
            <div class="form-group">
                <label for="title">歌曲名称:</label>
                <input type="text" id="title" name="title" placeholder="输入歌曲名称" required>
            </div>

            <div class="form-group">
                <label for="artist">歌手:</label>
                <input type="text" id="artist" name="artist" placeholder="输入歌手名称" required>
            </div>

            <div class="form-group">
                <label for="album">专辑:</label>
                <input type="text" id="album" name="album" placeholder="输入专辑名称">
            </div>

            <div class="form-group">
                <label for="release_date">发行日期:</label>
                <input type="date" id="release_date" name="release_date" required>
            </div>

            <div class="form-group">
                <label for="duration">时长 (秒):</label>
                <input type="number" id="duration" name="duration" placeholder="输入时长（秒）" required>
            </div>

            <div class="form-group">
                <label for="type">类型:</label>
                <input type="text" id="type" name="type" placeholder="输入音乐类型">
            </div>

            <div class="form-group">
                <label for="language">语言:</label>
                <input type="text" id="language" name="language" placeholder="输入语言">
            </div>

            <div class="form-group">
                <label for="note">备注:</label>
                <textarea id="note" name="note" placeholder="输入备注"></textarea>
            </div>

            <button type="submit">添加歌曲</button>
        </form>

        <!-- 成功消息显示 -->
        <div id="message" style="display:none; color: green;">歌曲已成功添加!</div>
    </div>

    <script>
        // 表单提交处理逻辑
        document.getElementById('add-song-form').addEventListener('submit', function(event) {
            event.preventDefault();  // 阻止默认表单提交动作

            // 构建表单数据对象
            const formData = {
                title: document.getElementById('title').value,
                artist: document.getElementById('artist').value,
                album: document.getElementById('album').value,
                release_date: document.getElementById('release_date').value,
                duration: document.getElementById('duration').value,
                type: document.getElementById('type').value,
                language: document.getElementById('language').value,
                note: document.getElementById('note').value
            };

            // 使用 fetch 提交数据到后端
            fetch('/add-music', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)  // 将表单数据转换为 JSON 格式
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('message').style.display = 'block';  // 显示成功消息
                    document.getElementById('add-song-form').reset();  // 重置表单
                } else {
                    alert('提交失败，请重试!');
                }
            })
            .catch(error => {
                console.error('提交错误:', error);
            });
        });
    </script>
</body>
</html>
