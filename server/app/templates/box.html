<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="https://qianqiuzy-1313476938.cos.ap-shanghai.myqcloud.com/32x32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="https://qianqiuzy-1313476938.cos.ap-shanghai.myqcloud.com/16x16.png" sizes="16x16" type="image/png">
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='CSS/sidebar.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='CSS/box.css') }}"
    />
    <style>
      .thumbnail-container {
        display: flex;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .thumbnail {
        position: relative;
        display: inline-block;
        margin-right: 10px;
        margin-bottom: 10px;
      }

      .thumbnail img {
        max-width: 100px;
        max-height: 100px;
        border-radius: 5px;
      }

      .thumbnail .remove-btn {
        position: absolute;
        top: 0;
        right: 0;
        background-color: rgba(255, 0, 0, 0.7);
        color: white;
        border: none;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        text-align: center;
        cursor: pointer;
      }
    </style>
    <title>花礼的提问箱</title>
  </head>
  <body>
    <div id="overlay" class="overlay"></div>
    <div
      class="background-layer"
      style="
        background-image: url('https://qianqiuzy-1313476938.cos.ap-shanghai.myqcloud.com/harei-back.jpg');
      "
    ></div>
    <div id="sidebar-container"></div>
    <div class="main-content">
      <div class="profile-section">
        <div id="header">
          <img id="avatar" src="https://qianqiuzy-1313476938.cos.ap-shanghai.myqcloud.com/avatar.jpg" alt="花礼的头像" />
          <h1>花礼harei的提问箱</h1>
        </div>
        <textarea
          id="message-input"
          placeholder="请将你想要告诉花礼的小秘密说出来吧~"
        ></textarea>
        <input
          type="file"
          id="image-input"
          accept="image/*"
          multiple
          style="display: none"
        />
        <button id="add-files-button">添加文件</button>
        <!-- 添加文件按钮 -->
        <div class="thumbnail-container" id="thumbnail-container"></div>
        <button id="submit-button">提交</button>
        <div id="success-message" style="color: green; display: none">
          提交成功!
        </div>
      </div>
    </div>
    <script src="static/js/script.js"></script>
    <script src="static/js/box.js"></script>
  </body>
</html>
