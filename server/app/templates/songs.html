<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', filename='pic/32x32.png') }}" sizes="32x32" type="image/png">
    <link rel="icon" href="{{ url_for('static', filename='pic/16x16.png') }}" sizes="16x16" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/songs.css') }}">
    <title>花礼的歌单</title>
</head>
<body>
    <div id="overlay" class="overlay"></div>
    <div class="background-layer" style="background-image: url('https://qianqiuzy-1313476938.cos.ap-shanghai.myqcloud.com/harei-back.jpg');"></div>
    
    <div class="sidebar" id="sidebar">
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
        <div class="icon-group">
            <a class="icon-item" href="/">
                <img src="/static/pic/home.png" alt="Home">
                <span class="icon-text">首页</span>
            </a>
            <a class="icon-item" href="/songs">
                <img src="/static/pic/music.png" alt="Songs">
                <span class="icon-text">歌单</span>
            </a>
            <a class="icon-item" href="/box">
                <img src="/static/pic/box.png" alt="Box">
                <span class="icon-text">提问箱</span>
            </a>
            <a class="icon-item" href="https://space.bilibili.com/1048135385" target="_blank">
                <img src="/static/pic/space.png" alt="harei">
                <span class="icon-text">花礼的空间</span>
            </a>
            <a class="icon-item" href="https://live.bilibili.com/1820703922" target="_blank">
                <img src="/static/pic/stream.png" alt="harei">
                <span class="icon-text">花礼的直播间</span>
            </a>
            <a class="icon-item" href="https://space.bilibili.com/3546636416452709" target="_blank">
                <img src="/static/pic/lubo.png" alt="harei">
                <span class="icon-text">花礼的录播号</span>
            </a>
            <a class="icon-item" href="https://github.com/QianQiuZy/harei.cn" target="_blank">
                <img src="/static/pic/github.png" alt="GitHub">
                <span class="icon-text">源代码</span>
            </a>
            <a class="icon-item" href="https://space.bilibili.com/351708822" target="_blank">
                <img src="/static/pic/zuozhe.png" alt="zuozhe">
                <span class="icon-text">联系作者</span>
            </a>
        </div>
    </div>

    <div class="main-content">
        <div class="profile-section">
            <div class="search-area">
                <input type="text" id="search" placeholder="搜索...">
            </div>

            <div class="song-table">
                <div class="table-header">
                    <span class="song-name">歌曲名称</span>
                    <span class="artist-name">歌手</span>
                    <span class="album-name">专辑</span>
                    <span class="release-date">发行日期</span>
                    <span class="duration">时长 (秒)</span>
                </div>
                <div class="table-content" id="song-table-content">
                    <!-- 动态加载的歌曲将会插入到这里 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // 页面加载时从后端获取歌曲数据
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/music')
                .then(response => response.json())
                .then(data => {
                    const songTableContent = document.getElementById('song-table-content');
                    songTableContent.innerHTML = '';  // 清空旧数据
                    data.forEach(song => {
                        const row = document.createElement('div');
                        row.classList.add('table-row');
                        row.innerHTML = `
                            <span class="song-name">${song.title}</span>
                            <span class="artist-name">${song.artist}</span>
                            <span class="album-name">${song.album || '无'}</span>
                            <span class="release-date">${song.release_date || '无'}</span>
                            <span class="duration">${song.duration || '无'}</span>
                        `;
                        songTableContent.appendChild(row);  // 插入新的歌曲行
                    });
                })
                .catch(error => console.error('Error fetching music data:', error));
        });
    </script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
